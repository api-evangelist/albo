aid: albo
name: Albo
description: 'Albo (albo.com, formerly albo.mx) is a Mexican digital financial services
  company founded in 2016 and operating since 2022 as an Institución de Fondos de Pago
  Electrónico (IFPE) authorized by the Comisión Nacional Bancaria y de Valores (CNBV)
  and regulated by Banco de México. Albo ships a mobile-first personal account with
  a Mastercard debit card — SPEI transfers, bill payments, cash deposit and withdrawal
  at partner locations, and real-time notifications — alongside "albo empresa", a business
  account for payroll, employee cards, and bulk dispersion of up to 3,000 transactions
  at a time. Adjacent credit (abea, by Aureo Lab) and crypto (albit, by Indigo DeFi)
  products are offered by independent partners. Albo publishes no public developer program:
  no developer portal, API reference, OpenAPI/AsyncAPI specification, SDK, webhook catalog,
  or sandbox was found on any albo.com, albo.mx or albo.live host.'
